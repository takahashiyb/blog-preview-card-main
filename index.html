<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <div class="blog-component">
        <div class="blog-image-section">
          <img
            class="blog-image"
            src="/assets/images/illustration-article.svg"
            alt="illustration-article"
          />
        </div>
        <div class="blog-content-section">
          <div class="blog-category-section">
            <p class="blog-category">Learning</p>
          </div>
          <p class="blog-publish-date">Published 21 Dec 2023</p>
          <p class="blog-title">HTML & CSS foundations</p>
          <p class="blog-blurb">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="blogger-section">
          <img
            src="/assets/images/image-avatar.webp"
            alt="blogger-avatar"
            class="blogger-avatar"
          />
          <p class="blogger-name">Greg Hooper</p>
        </div>
      </div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Your Name Here</a>.
      </div>
    </footer>
  </body>
</html>
